[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="content/*.json, content/**/*.json"
exclude_filter="tests/*, addons/gut/*, tools/*"
export_path="build/linux/RapidCCNA.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="content/*.json, content/**/*.json"
exclude_filter="tests/*, addons/gut/*, tools/*"
export_path="build/windows/RapidCCNA.exe"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.2]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="content/*.json, content/**/*.json"
exclude_filter="tests/*, addons/gut/*, tools/*"
export_path="build/web/index.html"

[preset.2.options]

variant/thread_support=false
html/canvas_resize_policy=2
