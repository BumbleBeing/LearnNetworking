name: RapidCCNA CI

on:
  push:
    paths: ["RapidCCNA/**", ".github/workflows/rapidccna.yml"]
  pull_request:
    paths: ["RapidCCNA/**", ".github/workflows/rapidccna.yml"]

env:
  GODOT_VERSION: "4.7"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RapidCCNA
    steps:
      - uses: actions/checkout@v4
      - name: Validate content
        run: python3 tools/validate_content.py --min-per-subtopic 5 --min-total 600
      - name: Content QA (answer-key giveaways, wording, links)
        run: |
          python3 tools/test_qa_content.py
          python3 tools/qa_content.py --strict
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot && rm godot.zip
      - name: Install GUT
        run: tools/install_gut.sh
      - name: Import project
        run: godot --headless --import --path . || true
      - name: GDScript warnings (what the editor would show)
        run: python3 tools/check_gdscript_warnings.py godot
      - name: Run unit tests
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd | tee gut.log
          if grep -q "Orphans" gut.log; then echo "::error::Tests left orphan nodes (see the GUT output above)"; exit 1; fi
      - name: End-to-end session smoke test
        run: godot --headless --path . -s res://tools/smoke_session.gd
      - name: Web export
        run: |
          python3 tools/fetch_web_templates.py "$GODOT_VERSION"
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.pck && test -s build/web/index.wasm
          ls -la build/web
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: rapidccna-web
          path: RapidCCNA/build/web
          retention-days: 14
